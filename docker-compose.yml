services:
  app:
    build: .
    image: ${DOCKER_USERNAME}/nodeapp:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - PORT=3000

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
